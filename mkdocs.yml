site_name: obsidian-pdf-exporter
site_description: >-
  Turn a folder of Obsidian notes into one polished PDF, with wiki links,
  embeds, callouts, Mermaid and community plugins, and make redline PDFs of
  the changes between two versions. Runs locally or in CI.
site_url: https://spenhouet.com/obsidian-pdf-exporter/
site_author: Sebastian Penhouet
copyright: Copyright &copy; 2026 Sebastian Penhouet

repo_url: https://github.com/Spenhouet/obsidian-pdf-exporter
repo_name: Spenhouet/obsidian-pdf-exporter
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: img/favicon.svg
  favicon: img/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - redirects:
      redirect_maps:
        obsidian/structure.md: plugins/folder-notes.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Spenhouet/obsidian-pdf-exporter
      name: Source on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/obsidian-pdf-exporter/
      name: Package on PyPI

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-state.js
  - javascripts/site.js

nav:
  - Home: index.md
  - Introduction: intro.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - CLI reference: reference/cli.md
      - Warnings: reference/warnings.md
  - Markdown:
      - markdown/index.md
      - Headings and text: markdown/text.md
      - Lists: markdown/lists.md
      - Tables: markdown/tables.md
      - Code blocks: markdown/code.md
      - Block quotes: markdown/quotes.md
      - Footnotes: markdown/footnotes.md
      - Links and images: markdown/links-images.md
      - Inline HTML: markdown/html.md
      - Math: markdown/math.md
  - Obsidian:
      - obsidian/index.md
      - Wiki links: obsidian/wiki-links.md
      - Embeds: obsidian/embeds.md
      - Block IDs: obsidian/block-ids.md
      - Callouts: obsidian/callouts.md
      - Highlights and comments: obsidian/highlights-comments.md
      - Tags: obsidian/tags.md
      - Properties: obsidian/properties.md
      - Tasks: obsidian/tasks.md
      - Line breaks: obsidian/line-breaks.md
      - Mermaid: obsidian/mermaid.md
      - Bases: obsidian/bases.md
  - Plugins:
      - plugins/index.md
      - Folder Notes: plugins/folder-notes.md
      - Dataview: plugins/dataview.md
      - Excalidraw: plugins/excalidraw.md
      - Meta Bind: plugins/meta-bind.md
      - Block Link Plus: plugins/block-link-plus.md
      - draw.io: plugins/drawio.md
      - Citations: plugins/citations.md
      - Write a plugin: plugins/write-a-plugin.md
  - Redline:
      - redline/index.md
      - Usage: redline/usage.md
      - Comparing versions: redline/compare.md
      - Styles and options: redline/styles.md
      - What changes look like: redline/changes.md
      - Blame: redline/blame.md
      - Styling the redline: redline/styling.md
      - Limitations and tips: redline/limitations.md
  - Templates and styling:
      - templating/index.md
      - Template folders: templating/folders.md
      - Header and footer: templating/header-footer.md
      - CSS reference: templating/css-reference.md
      - Python templates: templating/python.md
      - Recipes: templating/recipes.md
      - Debugging: templating/debugging.md
  - Use with AI agents: agents.md
  - Contributing: contributing.md
